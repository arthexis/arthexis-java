name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        install_mode: [new-install, upgrade-install]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (${{ matrix.install_mode }})
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          if [ "${{ matrix.install_mode }}" = "new-install" ]; then
            verify_command="mvn -B verify"
          else
            verify_command="mvn -B -Dtest=FlywayUpgradePathTests test"
          fi

          bash -lc "$verify_command" 2>&1 | tee ci-verify.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            {
              echo "error_message<<EOF"
              if grep -q "\[ERROR\]" ci-verify.log; then
                grep "\[ERROR\]" ci-verify.log | tail -n 40
              else
                tail -n 40 ci-verify.log
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Comment CI error on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.verify.outputs.status != '0'
        uses: actions/github-script@v7
        env:
          ERROR_MESSAGE: ${{ steps.verify.outputs.error_message }}
        with:
          script: |
            const marker = `<!-- arthexis-ci-failure-${{ matrix.install_mode }} -->`;
            const mode = '${{ matrix.install_mode }}';
            const raw = process.env.ERROR_MESSAGE || 'No error details captured.';
            const maxLength = 65000;
            const content = raw.length > maxLength
              ? `${raw.slice(0, maxLength)}\n... (truncated)`
              : raw;
            const body = `${marker}
            ⚠️ CI failed during ${mode} validation.

            \`\`\`text
            ${content}
            \`\`\`
            `;
            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
      - name: Fail workflow if verify failed
        if: steps.verify.outputs.status != '0'
        run: |
          echo "Verification failed for install mode: ${{ matrix.install_mode }}"
          exit 1

  raspberry-pi-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-bookworm
            image: maven:3.9.9-eclipse-temurin-21-bookworm
            install_mode: new-install
          - distro: ubuntu-jammy
            image: maven:3.9.9-eclipse-temurin-21-jammy
            install_mode: new-install
          - distro: ubuntu-noble
            image: maven:3.9.9-eclipse-temurin-21-noble
            install_mode: new-install
          - distro: debian-bookworm-upgrade
            image: maven:3.9.9-eclipse-temurin-21-bookworm
            install_mode: upgrade-install
          - distro: ubuntu-jammy-upgrade
            image: maven:3.9.9-eclipse-temurin-21-jammy
            install_mode: upgrade-install
          - distro: ubuntu-noble-upgrade
            image: maven:3.9.9-eclipse-temurin-21-noble
            install_mode: upgrade-install
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Run Raspberry Pi 4B ARM64 compatibility tests (${{ matrix.distro }})
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.install_mode }}" = "upgrade-install" ]; then
            verify_command="mvn -B -Dtest=FlywayUpgradePathTests test"
          else
            verify_command="mvn -B -Dtest=ArthexisApplicationTests,ArchitectureTests,ModularityTests test"
          fi

          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/workspace \
            -v "$HOME/.m2":/root/.m2 \
            -w /workspace \
            "${{ matrix.image }}" \
            bash -lc "$verify_command"
