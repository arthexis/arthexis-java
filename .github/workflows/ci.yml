name: CI

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        install_mode: [new-install, upgrade-install]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (${{ matrix.install_mode }})
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          if [ "${{ matrix.install_mode }}" = "new-install" ]; then
            verify_command="mvn -B verify"
          else
            verify_command="mvn -B -Dtest=FlywayUpgradePathTests test"
          fi

          bash -lc "$verify_command" 2>&1 | tee ci-verify.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            {
              echo "error_message<<EOF"
              if grep -q "\[ERROR\]" ci-verify.log; then
                grep "\[ERROR\]" ci-verify.log | tail -n 40
              else
                tail -n 40 ci-verify.log
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update issue with failure context
        if: steps.verify.outputs.status != '0'
        uses: actions/github-script@v7
        env:
          ERROR_MESSAGE: ${{ steps.verify.outputs.error_message }}
        with:
          script: |
            const mode = '${{ matrix.install_mode }}';
            const title = `[CI] Hourly ${mode} validation failed`;
            const marker = `<!-- arthexis-hourly-ci-failure-${{ matrix.install_mode }} -->`;
            const raw = process.env.ERROR_MESSAGE || 'No error details captured.';
            const maxLength = 65000;
            const content = raw.length > maxLength
              ? `${raw.slice(0, maxLength)}\n... (truncated)`
              : raw;
            const body = `${marker}
            Hourly install/upgrade validation failed for **${mode}**.

            - Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            - Commit: ${context.sha}

            \`\`\`text
            ${content}
            \`\`\`
            `;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && issue.body && issue.body.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['ci']
              });
            }
      - name: Fail workflow if verify failed
        if: steps.verify.outputs.status != '0'
        run: |
          echo "Verification failed for install mode: ${{ matrix.install_mode }}"
          exit 1

  rpi-compat:
    name: rpi-compat (${{ matrix.distro }} / ${{ matrix.install_mode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-bookworm
            image: maven:3.9.9-eclipse-temurin-21
            install_mode: new-install
          - distro: ubuntu-noble
            image: maven:3.9.9-eclipse-temurin-21-noble
            install_mode: new-install
          - distro: debian-bookworm-upgrade
            image: maven:3.9.9-eclipse-temurin-21
            install_mode: upgrade-install
          - distro: ubuntu-noble-upgrade
            image: maven:3.9.9-eclipse-temurin-21-noble
            install_mode: upgrade-install
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Run rpi-compat tests (${{ matrix.distro }})
        id: verify_rpi
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          if [ "${{ matrix.install_mode }}" = "upgrade-install" ]; then
            verify_command="mvn -B -Dtest=FlywayUpgradePathTests test"
          else
            verify_command="mvn -B -Dtest=ArthexisApplicationTests,ArchitectureTests,ModularityTests test"
          fi

          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/workspace \
            -v "$HOME/.m2":/root/.m2 \
            -w /workspace \
            "${{ matrix.image }}" \
            bash -lc "$verify_command" 2>&1 | tee ci-rpi-verify.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            {
              echo "error_message<<EOF"
              if grep -q "\[ERROR\]" ci-rpi-verify.log; then
                grep "\[ERROR\]" ci-rpi-verify.log | tail -n 40
              else
                tail -n 40 ci-rpi-verify.log
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update issue with rpi-compat failure context
        if: steps.verify_rpi.outputs.status != '0'
        uses: actions/github-script@v7
        env:
          ERROR_MESSAGE: ${{ steps.verify_rpi.outputs.error_message }}
        with:
          script: |
            const distro = '${{ matrix.distro }}';
            const mode = '${{ matrix.install_mode }}';
            const title = `[CI] Hourly rpi-compat ${distro} ${mode} validation failed`;
            const marker = `<!-- arthexis-hourly-rpi-ci-failure-${{ matrix.distro }}-${{ matrix.install_mode }} -->`;
            const raw = process.env.ERROR_MESSAGE || 'No error details captured.';
            const maxLength = 65000;
            const content = raw.length > maxLength
              ? `${raw.slice(0, maxLength)}\n... (truncated)`
              : raw;
            const body = `${marker}
            Hourly rpi-compat validation failed for **${distro} / ${mode}**.

            - Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            - Commit: ${context.sha}

            \`\`\`text
            ${content}
            \`\`\`
            `;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && issue.body && issue.body.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['ci']
              });
            }
      - name: Fail workflow if rpi-compat verify failed
        if: steps.verify_rpi.outputs.status != '0'
        run: |
          echo "RPI compatibility verification failed for: ${{ matrix.distro }} / ${{ matrix.install_mode }}"
          exit 1

  ui-screenshots:
    name: ui-screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium for Playwright
        run: npx --yes -p playwright@1.53.0 playwright install --with-deps chromium
      - name: Capture admin and user UI screenshots
        run: |
          mkdir -p artifacts/screenshots
          npx --yes -p playwright@1.53.0 node <<'EOF_NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });

            const captures = [
              {
                input: path.resolve('src/main/resources/static/admin/index.html'),
                output: path.resolve('artifacts/screenshots/admin-ui.png')
              },
              {
                input: path.resolve('src/main/resources/static/cp/index.html'),
                output: path.resolve('artifacts/screenshots/user-ui.png')
              }
            ];

            for (const capture of captures) {
              await page.goto(`file://${capture.input}`);
              await page.screenshot({ path: capture.output, fullPage: true });
            }

            await browser.close();
          })();
          EOF_NODE
      - name: Upload UI screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/screenshots
