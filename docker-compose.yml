services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: arthexis
      POSTGRES_USER: arthexis
      POSTGRES_PASSWORD: arthexis
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
