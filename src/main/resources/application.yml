spring:
  application:
    name: arthexis-java
  datasource:
    url: jdbc:postgresql://localhost:5432/arthexis
    username: arthexis
    password: arthexis
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/arthexis

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

arthexis:
  jobs:
    station-poll-delay-ms: 60000

logging:
  pattern:
    level: "%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]"
