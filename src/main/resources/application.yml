spring:
  application:
    name: arthexis-java
  datasource:
    url: jdbc:postgresql://localhost:5432/arthexis
    username: arthexis
    password: arthexis
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

arthexis:
  runtime:
    startup-budget: 90s
    migration-budget: 30s
  jobs:
    station-poll-enabled: true
    station-poll-delay-ms: 60000
    station-poll-queue: arthexis.station.poll
    max-attempts: 3
  ocpp:
    commands:
      retry-delay: 20s
      ack-timeout: 45s
      max-retries: 3
      scheduler-delay-ms: 5000
    simulator:
      enabled: false
      csms-url: ws://localhost:8080/ws/ocpp
      charge-point-id: sim-cp-001
      heartbeat-interval: 60s
      reconnect-delay: 10s
  rfid:
    login-base-url: https://app.arthexis.local/energy/login
    login-session-ttl: 10m
    trusted-login-window: 15m

logging:
  pattern:
    level: "%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]"

otel:
  sdk:
    disabled: true
